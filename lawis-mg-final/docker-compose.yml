services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lexia_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - REACT_APP_API_URL=https://lexia-maroc.duckdns.org/api
        - REACT_APP_GOOGLE_CLIENT_ID=325608169428-7rr4gj515tei6eqojmaovj17mope2sfq.apps.googleusercontent.com
        - REACT_APP_GA_MEASUREMENT_ID=G-W3L99GNS2L
    container_name: lexia_frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  watcher:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lexia_watcher
    command: python -m ingestion.scheduler
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: lexia_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: lexia_network
