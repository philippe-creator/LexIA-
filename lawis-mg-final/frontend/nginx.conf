server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # En-têtes de sécurité — appliqués à toutes les réponses (documents,
    # assets statiques). Ajuster connect-src si REACT_APP_API_URL change.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # accounts.google.com/gsi/* : script + iframe du bouton "Se connecter avec
    # Google" (Google Identity Services) — ajusté en même temps que connect-src
    # si REACT_APP_API_URL change (voir commentaire au-dessus).
    # fonts.googleapis.com/fonts.gstatic.com : police Open Sans (voir index.html).
    # googletagmanager.com/google-analytics.com : mesure d'audience, chargée
    # uniquement après consentement au bandeau cookies (voir services/analytics.js).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 https://localhost:8000 https://accounts.google.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
